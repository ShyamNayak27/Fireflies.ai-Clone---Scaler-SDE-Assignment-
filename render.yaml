services:
  - type: web
    name: fireflies-clone-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -e . && alembic upgrade head
    startCommand: python -m app.seed.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Set to the Supabase connection string in the Render dashboard —
      # `postgresql+asyncpg://...` (the `+asyncpg` driver segment is required;
      # Supabase's own connection strings don't include it). Never committed —
      # see docs/ARCHITECTURE.md §11.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false # set to '["https://<your-vercel-app>.vercel.app"]' once the frontend is deployed
      - key: ENVIRONMENT
        value: production
      - key: SUMMARIZER_BACKEND
        value: seeded # "llm" once OPENAI_API_KEY is set below
      - key: OPENAI_API_KEY
        sync: false
      - key: INGEST_SCRUB_SALT
        generateValue: true
      - key: SENTRY_DSN
        sync: false
