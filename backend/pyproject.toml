[project]
name = "fireflies-clone-backend"
version = "0.1.0"
description = "Meeting notes & transcription platform — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "slowapi>=0.1.9",
  "cachetools>=5.3",
  "openai>=1.40",
  "sentry-sdk[fastapi]>=2.10",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 (function call in a default argument) is ruff's standard exception for
# FastAPI's own `Depends(...)`/`Query(...)`/`File(...)` pattern — ruff's docs
# explicitly call this out as safe to ignore in FastAPI codebases; every
# occurrence in this repo is exactly that pattern, not a real footgun.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Enforces the layering rule stated in docs/ARCHITECTURE.md §6.1:
# routers never touch a Session, repositories never raise HTTPException,
# services never import from routers. Run with `lint-imports`.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Repositories do not import from services or routers"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = ["app.services", "app.routers"]

[[tool.importlinter.contracts]]
name = "Services do not import from routers"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.routers"]

[[tool.importlinter.contracts]]
name = "Layers stay ordered: routers -> services -> repositories"
type = "layers"
layers = ["app.routers", "app.services", "app.repositories"]
